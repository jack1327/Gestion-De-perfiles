<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            margin-left: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #qrcode {
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <h1>Generador de Código QR</h1>

    <input type="text" id="url" placeholder="Ingresa un link">
    <button onclick="generarQR()">Generar QR</button>

    <div id="qrcode"></div>

    <script>
        function generarQR() {
            let url = document.getElementById("url").value;

            if (!url) {
                alert("Ingresa un link válido");
                return;
            }

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: url,
                width: 200,
                height: 200
            });
        }
    </script>

</body>
</html>
